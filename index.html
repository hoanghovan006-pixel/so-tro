<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Trọ - Quản lý nhà trọ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2f1;--cd:#fff;--tx:#10201f;--mu:#5d706e;--pr:#0b6e69;--pt:#fff;--bd:#d5dedc;--ok:#157347;--wn:#b45309;--bad:#b42318;--bs:#e7f1f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1716;--cd:#18231f;--tx:#e6efed;--mu:#97aaa7;--pr:#3fd0c6;--pt:#04201e;--bd:#2a3a37;--ok:#5fd190;--wn:#f0b25a;--bad:#ff8a80;--bs:#1e2d2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1716;--cd:#18231f;--tx:#e6efed;--mu:#97aaa7;--pr:#3fd0c6;--pt:#04201e;--bd:#2a3a37;--ok:#5fd190;--wn:#f0b25a;--bad:#ff8a80;--bs:#1e2d2a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:96px}
#app{max-width:640px;margin:0 auto;padding:0 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;padding:10px 0;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header select{flex:1;min-width:0;font-weight:700}
h2{font-size:1.2rem;margin:10px 0}h3{font-size:1rem;margin:16px 0 8px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--cd)}
label{display:block;font-size:.86rem;color:var(--mu);margin:8px 0}
label input,label select{margin-top:4px;color:var(--tx);font-size:1rem}
button{padding:11px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);cursor:pointer;min-height:44px}
button.pr{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:700}
button.dg{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.card{background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:8px;padding:12px;margin:10px 0}
.card.ok{border-left-color:var(--ok)}.card.wn{border-left-color:var(--wn)}.card.bad{border-left-color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mu{color:var(--mu);font-size:.9rem}
.chip{font-size:.8rem;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.wn{color:var(--wn)}.chip.bad{color:var(--bad)}
.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}.ck input{width:auto}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right}td:first-child,th:first-child{text-align:left}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:.78rem;color:var(--mu);min-height:56px}
nav button.on{color:var(--pr);font-weight:700;box-shadow:inset 0 3px var(--pr)}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh h3{margin-top:0;font-size:1.1rem}.bt{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.bt button{flex:1}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:90%;display:none}
textarea{min-height:180px;font:.8rem/1.4 ui-monospace,Menlo,monospace}
#pr{position:fixed;inset:0;background:#5b6664;overflow:auto;z-index:40;padding:10px;color-scheme:light}
#pr .tb{display:flex;gap:8px;max-width:min(148mm,100%);margin:0 auto 10px}#pr .tb button{flex:1}
#pr .pg{width:148mm;min-height:205mm;margin:0 auto;background:#fff;color:#14201f;padding:10mm 9mm;font-size:10pt;line-height:1.4;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pr .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;border-bottom:2px solid #0b6e69;padding-bottom:4mm}
#pr .nm{font-size:15pt;font-weight:700;color:#0b6e69;line-height:1.2}
#pr .ti{text-align:right;font-size:17pt;color:#0b6e69;white-space:nowrap}
#pr .sm{font-size:8.5pt;color:#566}
#pr .inf{display:grid;grid-template-columns:1fr 1fr;gap:2mm 6mm;margin:4mm 0;font-size:8.5pt;color:#566}
#pr .inf b{display:block;font-size:10.5pt;color:#14201f}
#pr table.it{width:100%;border-collapse:collapse}
#pr .it th{background:#e7f1f0;color:#0b6e69;font-size:8.5pt;text-align:left;padding:2mm}
#pr .it td{padding:2mm;border-bottom:1px solid #d5dedc;text-align:left;vertical-align:top}
#pr .it td:nth-child(2){font-size:8pt;color:#566}
#pr .it th:last-child,#pr .it td:last-child{text-align:right;white-space:nowrap}
#pr .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:4mm;padding:3mm;background:#0b6e69;color:#fff;border-radius:2mm}
#pr .tot b{font-size:15pt}
#pr .wd{margin:2mm 0 0;font-size:9pt}
#pr .stt{margin:4mm 0 0;padding:2mm;border:1.5px solid;text-align:center;font-weight:700;border-radius:2mm}
#pr .stt.ok{color:#157347}#pr .stt.bad,#pr .stt.wn{color:#b42318}
#pr .ft{margin-top:auto;padding-top:5mm;font-size:8.5pt;color:#334}
#pr .sg{display:flex;justify-content:space-around;margin-top:4mm;text-align:center;font-size:9pt}#pr .sg>div{width:42%;height:24mm}
@media screen and (max-width:620px){#pr .pg{zoom:.6}}
@media print{@page{size:A5 portrait;margin:0}html,body{height:auto}body{padding:0!important}body::before{display:none!important}body>*:not(#pr){display:none!important}#pr{position:static;background:none;padding:0;overflow:visible}#pr .tb{display:none}#pr .pg{margin:0;zoom:1}}
</style>
</head>
<body>
<div id="app"><header id="hd"></header><main id="main"></main></div>
<nav id="nv"></nav><div id="ts" role="status"></div>
<script>
const K="sotro_v1";let S=null;
const def=()=>({cur:"p1",props:[{id:"p1",name:"Nhà trọ của tôi",e:3500,w:18000,wm:"unit",tr:0,net:0}],rooms:[],inv:[],exp:[]});
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.props)S=def();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vnd=n=>Math.round(n||0).toLocaleString("vi-VN")+"đ";
const uid=()=>Math.random().toString(36).slice(2,9);
const P=()=>S.props.find(p=>p.id===S.cur)||S.props[0];
const rooms=()=>S.rooms.filter(r=>r.pid===P().id);
const nowYM=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const today=()=>{const d=new Date();return nowYM()+"-"+String(d.getDate()).padStart(2,"0")};
const mf=m=>m.slice(5)+"/"+m.slice(0,4);
let tab="rooms",month=nowYM();
const st=i=>i.paid>=i.total?["Đã thu","ok"]:i.paid>0?["Thu một phần","wn"]:["Chưa thu","bad"];
const invOf=(rid,per)=>S.inv.find(i=>i.rid===rid&&i.per===per);
const rn=id=>{const r=S.rooms.find(x=>x.id===id);return r?r.name:"(phòng đã xóa)"};
let tt;function toast(m){const t=$("#ts");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",3200)}
function modal(title,html,btns){const m=document.createElement("div");m.className="ov";m.innerHTML='<div class="sh" role="dialog"><h3>'+title+'</h3><div>'+html+'</div><div class="bt"></div></div>';
 btns.forEach(([l,c,f])=>{const b=document.createElement("button");b.textContent=l;b.className=c||"";b.onclick=()=>{if(!f||f(m)!==false)m.remove()};m.querySelector(".bt").append(b)});
 m.onclick=e=>{if(e.target===m)m.remove()};document.body.append(m);return m}
const fld=(k,l,t,v)=>'<label>'+l+'<input name="'+k+'" type="'+(t||"text")+'"'+(t==="number"?' inputmode="decimal" step="any"':"")+' value="'+esc(v==null?"":v)+'"></label>';
const gv=(m,k)=>m.querySelector('[name="'+k+'"]').value;
const ask=(msg,fn)=>modal("Xác nhận","<p>"+msg+"</p>",[["Hủy"],["Đồng ý","dg",()=>{fn()}]]);

const V={
rooms(){const L=rooms();
 return '<div class="row"><h2>Phòng ('+L.length+')</h2><button class="pr" onclick="roomForm()">+ Thêm phòng</button></div>'+
 (L.length?L.map(r=>{const i=invOf(r.id,month),s=i?st(i):null;
  return '<div class="card '+(s?s[1]:"")+'" onclick="roomForm(\''+r.id+'\')"><div class="row"><b>'+esc(r.name)+'</b>'+(s?'<span class="chip '+s[1]+'">'+s[0]+'</span>':"")+'</div><div class="mu">'+(r.tn?esc(r.tn)+" · "+r.pp+" người":"Phòng trống")+'</div><div>'+vnd(r.rent)+'/tháng</div></div>'}).join("")
  :'<p class="mu">Chưa có phòng. Bấm "+ Thêm phòng" để bắt đầu. Nhập tên khách thuê để phòng được tính vào hóa đơn.</p>')+
 '<p class="mu">Viền màu cho biết hóa đơn tháng '+mf(month)+': xanh là đã thu, vàng là thu một phần, đỏ là chưa thu.</p>'},
bill(){const L=rooms().filter(r=>r.tn);
 return '<h2>Chốt số tháng '+mf(month)+'</h2>'+(L.length?L.map(r=>{const i=invOf(r.id,month);
  if(i){const s=st(i);return '<div class="card '+s[1]+'"><div class="row"><b>'+esc(r.name)+'</b><span class="chip '+s[1]+'">'+s[0]+'</span></div><div class="mu">Đã có hóa đơn '+vnd(i.total)+'</div></div>'}
  return '<div class="card"><b>'+esc(r.name)+'</b> <span class="mu">'+esc(r.tn)+'</span><div class="g2"><label>Điện (cũ '+r.e+')<input id="ne'+r.id+'" type="number" inputmode="decimal" placeholder="Số mới"></label><label>Nước (cũ '+r.w+')<input id="nw'+r.id+'" type="number" inputmode="decimal" placeholder="Số mới"></label></div>'+
  '<label class="ck"><input type="checkbox" id="re'+r.id+'">Vừa thay đồng hồ điện (số cũ tính là 0)</label><label class="ck"><input type="checkbox" id="rw'+r.id+'">Vừa thay đồng hồ nước (số cũ tính là 0)</label>'+
  '<div class="g2"><label>Khoản phát sinh (đ)<input id="ex'+r.id+'" type="number" inputmode="decimal"></label><label>Ghi chú khoản đó<input id="en'+r.id+'"></label></div><button class="pr" onclick="mk(\''+r.id+'\')">Tạo hóa đơn</button></div>'}).join("")
  :'<p class="mu">Chưa có phòng nào đang thuê. Vào tab Phòng, thêm phòng và nhập tên khách thuê.</p>')},
inv(){const L=S.inv.filter(i=>i.pid===P().id&&i.per===month);const t=L.reduce((s,i)=>s+i.total,0),pd=L.reduce((s,i)=>s+Math.min(i.paid,i.total),0);
 return '<h2>Hóa đơn tháng '+mf(month)+'</h2><div class="card">Tổng '+vnd(t)+'<br>Đã thu '+vnd(pd)+'<br><b>Còn phải thu '+vnd(t-pd)+'</b></div>'+
 (L.length?L.map(i=>{const s=st(i);return '<div class="card '+s[1]+'" onclick="invView(\''+i.id+'\')"><div class="row"><b>'+esc(rn(i.rid))+'</b><span class="chip '+s[1]+'">'+s[0]+'</span></div><div>'+vnd(i.total)+'</div></div>'}).join(""):'<p class="mu">Tháng này chưa có hóa đơn. Vào tab Chốt số để tạo.</p>')},
fin(){const p=P().id,I=S.inv.filter(i=>i.pid===p),X=S.exp.filter(x=>x.pid===p),y=month.slice(0,4);
 const th=m=>I.filter(i=>i.per===m).reduce((s,i)=>s+Math.min(i.paid,i.total),0),ch=m=>X.filter(x=>x.d.slice(0,7)===m).reduce((s,x)=>s+x.a,0);
 let rows="";for(let k=1;k<=12;k++){const m=y+"-"+String(k).padStart(2,"0");rows+='<tr><td>'+k+'</td><td>'+vnd(th(m))+'</td><td>'+vnd(ch(m))+'</td><td>'+vnd(th(m)-ch(m))+'</td></tr>'}
 const xs=X.filter(x=>x.d.slice(0,7)===month);
 return '<div class="row"><h2>Thu chi tháng '+mf(month)+'</h2><button class="pr" onclick="expForm()">+ Chi phí</button></div><div class="card">Thu '+vnd(th(month))+'<br>Chi '+vnd(ch(month))+'<br><b>Lãi '+vnd(th(month)-ch(month))+'</b></div>'+
 (xs.length?xs.map(x=>'<div class="card" onclick="expDel(\''+x.id+'\')"><div class="row"><span>'+esc(x.c)+' <span class="mu">'+esc(x.n)+" "+x.d.slice(8)+"/"+x.d.slice(5,7)+'</span></span><b>'+vnd(x.a)+'</b></div></div>').join(""):'<p class="mu">Chưa ghi chi phí nào trong tháng này. Chạm vào một khoản để xóa.</p>')+
 '<h3>Năm '+y+'</h3><div class="sc"><table><tr><th>Tháng</th><th>Thu</th><th>Chi</th><th>Lãi</th></tr>'+rows+'</table></div><p><button onclick="exportT()">Xuất bảng cho Excel</button></p>'},
set(){const p=P();
 return '<h2>Cài đặt</h2><div class="card"><label>Tên nhà trọ<input id="sn" value="'+esc(p.name)+'"></label><label>Địa chỉ (in trên hóa đơn)<input id="sa" value="'+esc(p.ad||"")+'"></label><label>Số điện thoại chủ trọ<input id="sp" type="tel" value="'+esc(p.ph||"")+'"></label><label>Thông tin chuyển khoản (ngân hàng, số tài khoản, tên)<input id="sb" value="'+esc(p.bk||"")+'"></label><label>Lời nhắn cuối hóa đơn<input id="ss" value="'+esc(p.nt||"")+'"></label><div class="g2"><label>Giá điện (đ/số)<input id="se" type="number" inputmode="decimal" value="'+p.e+'"></label><label>Giá nước (đ)<input id="sw" type="number" inputmode="decimal" value="'+p.w+'"></label></div>'+
 '<label>Cách tính nước<select id="sm"><option value="unit"'+(p.wm==="unit"?" selected":"")+'>Theo số khối</option><option value="person"'+(p.wm==="person"?" selected":"")+'>Theo đầu người</option></select></label><div class="g2"><label>Tiền rác mỗi phòng (đ)<input id="st" type="number" inputmode="decimal" value="'+p.tr+'"></label><label>Internet mỗi phòng (đ)<input id="si" type="number" inputmode="decimal" value="'+p.net+'"></label></div><button class="pr" onclick="saveSet()">Lưu cài đặt</button></div>'+
 '<div class="bt"><button onclick="addProp()">+ Thêm nhà trọ</button>'+(S.props.length>1?'<button class="dg" onclick="delProp()">Xóa nhà này</button>':"")+'</div>'+
 '<h3>Sao lưu dữ liệu</h3><p class="mu">Dữ liệu được lưu ngay trên trình duyệt của máy này, dùng được khi không có mạng. Xóa dữ liệu trình duyệt sẽ mất hết, nên hãy sao lưu thường xuyên.</p><div class="bt"><button onclick="backup()">Sao lưu</button><button onclick="restore()">Khôi phục</button></div>'}
};
function render(){const p=P();
 $("#hd").innerHTML='<select aria-label="Chọn nhà trọ" onchange="S.cur=this.value;save();render()">'+S.props.map(x=>'<option value="'+x.id+'"'+(x.id===p.id?" selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select><input type="month" aria-label="Chọn tháng" style="width:auto" value="'+month+'" onchange="month=this.value||nowYM();render()">';
 $("#main").innerHTML=V[tab]();
 $("#nv").innerHTML=[["rooms","Phòng"],["bill","Chốt số"],["inv","Hóa đơn"],["fin","Thu chi"],["set","Cài đặt"]].map(t=>'<button class="'+(t[0]===tab?"on":"")+'" onclick="tab=\''+t[0]+'\';render();scrollTo(0,0)">'+t[1]+'</button>').join("")}

function roomForm(id){const r=id?S.rooms.find(x=>x.id===id):{name:"",rent:0,tn:"",ph:"",pp:1,e:0,w:0};
 const b=[["Hủy"],["Lưu","pr",m=>{const n=gv(m,"name").trim();if(!n){toast("Nhập tên phòng");return false}
  const d={name:n,rent:+gv(m,"rent")||0,tn:gv(m,"tn").trim(),ph:gv(m,"ph").trim(),pp:Math.max(1,+gv(m,"pp")||1),e:+gv(m,"e")||0,w:+gv(m,"w")||0};
  if(id)Object.assign(r,d);else S.rooms.push(Object.assign({id:uid(),pid:P().id},d));save();render()}]];
 if(id)b.splice(1,0,["Xóa","dg",()=>{ask("Xóa phòng "+esc(r.name)+"? Hóa đơn cũ vẫn được giữ.",()=>{S.rooms=S.rooms.filter(x=>x.id!==id);save();render()})}]);
 modal(id?"Sửa phòng":"Thêm phòng",fld("name","Tên phòng (ví dụ: P101)","text",r.name)+fld("rent","Tiền thuê mỗi tháng (đ)","number",r.rent)+fld("tn","Tên khách thuê (để trống nếu phòng trống)","text",r.tn)+fld("ph","Số điện thoại khách","tel",r.ph)+fld("pp","Số người ở","number",r.pp)+fld("e","Chỉ số điện hiện tại","number",r.e)+fld("w","Chỉ số nước hiện tại","number",r.w),b)}

function mk(id){const r=S.rooms.find(x=>x.id===id),p=P(),g=k=>$("#"+k+id);
 if(g("ne").value===""||g("nw").value==="")return toast("Nhập đủ chỉ số điện và nước mới");
 const E=+g("ne").value,W=+g("nw").value,re=g("re").checked,rw=g("rw").checked;
 if((!re&&E<r.e)||(!rw&&W<r.w))return toast("Chỉ số mới nhỏ hơn số cũ. Nếu vừa thay đồng hồ, hãy tích ô thay đồng hồ.");
 const ue=re?E:E-r.e,uw=rw?W:W-r.w,x=+g("ex").value||0,wp=p.wm==="person";
 const L=[["Tiền phòng","",r.rent],["Điện",(re?"đồng hồ mới 0":r.e)+" → "+E+", "+ue+" số × "+vnd(p.e),ue*p.e],
  ["Nước",wp?r.pp+" người × "+vnd(p.w):(rw?"đồng hồ mới 0":r.w)+" → "+W+", "+uw+" khối × "+vnd(p.w),wp?r.pp*p.w:uw*p.w]];
 if(p.tr)L.push(["Rác","",p.tr]);if(p.net)L.push(["Internet","",p.net]);if(x)L.push([g("en").value.trim()||"Phát sinh","",x]);
 S.inv.push({id:uid(),rid:id,pid:p.id,per:month,L:L,total:L.reduce((s,l)=>s+l[2],0),paid:0,e0:r.e,e1:E,w0:r.w,w1:W});
 r.e=E;r.w=W;save();toast("Đã tạo hóa đơn "+r.name);render()}

function invText(i){const r=S.rooms.find(x=>x.id===i.rid),p=S.props.find(x=>x.id===i.pid)||P();
 return "HÓA ĐƠN TIỀN TRỌ - THÁNG "+mf(i.per)+"\n"+p.name+" - Phòng "+rn(i.rid)+(r&&r.tn?"\nKhách thuê: "+r.tn:"")+"\n\n"+
 i.L.map(l=>"- "+l[0]+": "+vnd(l[2])+(l[1]?" ("+l[1]+")":"")).join("\n")+"\n\nTỔNG CỘNG: "+vnd(i.total)+"\nĐã thu: "+vnd(Math.min(i.paid,i.total))+"\nCòn lại: "+vnd(Math.max(0,i.total-i.paid))}
function invView(id){const i=S.inv.find(x=>x.id===id),s=st(i);
 modal("Phòng "+esc(rn(i.rid))+" - tháng "+mf(i.per),'<table>'+i.L.map(l=>'<tr><td>'+esc(l[0])+'<div class="mu">'+esc(l[1])+'</div></td><td>'+vnd(l[2])+'</td></tr>').join("")+'<tr><td><b>Tổng</b></td><td><b>'+vnd(i.total)+'</b></td></tr></table><p><span class="chip '+s[1]+'">'+s[0]+'</span> Đã thu '+vnd(Math.min(i.paid,i.total))+'</p>',
 [["In hóa đơn A5","pr",()=>{printInv(i)}],["Chia sẻ",0,()=>{share(i)}],["Thu đủ",0,()=>{i.paid=i.total;save();render()}],["Ghi nhận thu",0,()=>{payForm(i)}],["Xóa","dg",()=>{ask("Xóa hóa đơn này?",()=>{const r=S.rooms.find(x=>x.id===i.rid);if(r&&r.e===i.e1&&r.w===i.w1){r.e=i.e0;r.w=i.w0}S.inv=S.inv.filter(x=>x.id!==i.id);save();render()})}],["Đóng"]])}
function payForm(i){modal("Ghi nhận khoản thu",'<p class="mu">Còn lại '+vnd(Math.max(0,i.total-i.paid))+'</p>'+fld("a","Số tiền vừa thu (đ)","number",""),[["Hủy"],["Lưu","pr",m=>{const a=+gv(m,"a");if(!(a>0)){toast("Nhập số tiền lớn hơn 0");return false}i.paid+=a;save();render()}]])}
async function share(i){const t=invText(i);try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==="AbortError")return}
 showText("Nội dung hóa đơn",t)}
function showText(title,t,extra){const m=modal(title,'<textarea readonly>'+esc(t)+'</textarea><p class="mu">'+(extra||"Bấm Sao chép, hoặc chọn tất cả rồi sao chép thủ công.")+'</p>',[["Sao chép","pr",m=>{const a=m.querySelector("textarea");a.select();try{navigator.clipboard.writeText(t).then(()=>toast("Đã sao chép"),()=>document.execCommand("copy"))}catch(e){document.execCommand("copy")}return false}],["Đóng"]])}

function expForm(){modal("Thêm chi phí",fld("d","Ngày","date",today())+fld("c","Loại chi phí (ví dụ: Sửa chữa)","text","")+fld("a","Số tiền (đ)","number","")+fld("n","Ghi chú","text",""),
 [["Hủy"],["Lưu","pr",m=>{const a=+gv(m,"a"),d=gv(m,"d");if(!(a>0)||!d){toast("Nhập ngày và số tiền");return false}S.exp.push({id:uid(),pid:P().id,d:d,c:gv(m,"c").trim()||"Khác",a:a,n:gv(m,"n").trim()});save();render()}]])}
function expDel(id){ask("Xóa khoản chi này?",()=>{S.exp=S.exp.filter(x=>x.id!==id);save();render()})}
function exportT(){const p=P().id,y=month.slice(0,4),I=S.inv.filter(i=>i.pid===p&&i.per.slice(0,4)===y),X=S.exp.filter(x=>x.pid===p&&x.d.slice(0,4)===y);
 const th=m=>I.filter(i=>i.per===m).reduce((s,i)=>s+Math.min(i.paid,i.total),0),ch=m=>X.filter(x=>x.d.slice(0,7)===m).reduce((s,x)=>s+x.a,0);
 let t="Tháng\tThu\tChi\tLãi\n";for(let k=1;k<=12;k++){const m=y+"-"+String(k).padStart(2,"0");t+=k+"\t"+th(m)+"\t"+ch(m)+"\t"+(th(m)-ch(m))+"\n"}
 t+="\nPhòng\tTháng\tTổng\tĐã thu\n"+I.map(i=>rn(i.rid)+"\t"+i.per+"\t"+i.total+"\t"+Math.min(i.paid,i.total)).join("\n");
 showText("Bảng năm "+y,t,"Sao chép rồi dán vào Excel hoặc Google Sheets, các cột sẽ tự chia ô.")}

function saveSet(){const p=P();p.name=$("#sn").value.trim()||p.name;p.ad=$("#sa").value.trim();p.ph=$("#sp").value.trim();p.bk=$("#sb").value.trim();p.nt=$("#ss").value.trim();p.e=+$("#se").value||0;p.w=+$("#sw").value||0;p.wm=$("#sm").value;p.tr=+$("#st").value||0;p.net=+$("#si").value||0;save();toast("Đã lưu cài đặt");render()}
function addProp(){modal("Thêm nhà trọ",fld("n","Tên nhà trọ","text",""),[["Hủy"],["Thêm","pr",m=>{const n=gv(m,"n").trim();if(!n){toast("Nhập tên nhà trọ");return false}const id=uid();S.props.push({id:id,name:n,e:3500,w:18000,wm:"unit",tr:0,net:0});S.cur=id;save();render()}]])}
function delProp(){const p=P();ask("Xóa nhà "+esc(p.name)+" cùng toàn bộ phòng, hóa đơn và chi phí của nhà này?",()=>{S.rooms=S.rooms.filter(x=>x.pid!==p.id);S.inv=S.inv.filter(x=>x.pid!==p.id);S.exp=S.exp.filter(x=>x.pid!==p.id);S.props=S.props.filter(x=>x.id!==p.id);S.cur=S.props[0].id;save();render()})}
function backup(){showText("Sao lưu dữ liệu",JSON.stringify(S),"Sao chép đoạn này và lưu vào ghi chú hoặc tin nhắn cho chính bạn. Dùng Khôi phục để nạp lại.")}
function restore(){modal("Khôi phục dữ liệu",'<label>Dán đoạn sao lưu vào đây<textarea name="j"></textarea></label><p class="mu">Dữ liệu hiện tại sẽ bị thay thế.</p>',[["Hủy"],["Khôi phục","pr",m=>{try{const d=JSON.parse(gv(m,"j"));if(!d.props||!d.props.length||!d.rooms||!d.inv||!d.exp)throw 0;S=d;if(!S.props.find(x=>x.id===S.cur))S.cur=S.props[0].id;save();render();toast("Đã khôi phục")}catch(e){toast("Đoạn sao lưu không hợp lệ");return false}}]])}
const D=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function r3(n,f){const h=n/100|0,t=n%100/10|0,u=n%10,s=[];
 if(h||(f&&(t||u)))s.push(D[h],"trăm");
 if(t>1){s.push(D[t],"mươi");if(u==1)s.push("mốt");else if(u==5)s.push("lăm");else if(u)s.push(D[u])}
 else if(t==1){s.push("mười");if(u==5)s.push("lăm");else if(u)s.push(D[u])}
 else if(u){if(s.length)s.push("lẻ");s.push(D[u])}
 return s.join(" ")}
function words(n){n=Math.round(n);if(!n)return"Không đồng";const U=["","nghìn","triệu","tỷ"],g=[];while(n>0){g.push(n%1000);n=Math.floor(n/1000)}
 const o=[];for(let i=g.length-1;i>=0;i--){if(g[i])o.push(r3(g[i],i<g.length-1)+(U[i]?" "+U[i]:""))}
 const s=o.join(" ");return s[0].toUpperCase()+s.slice(1)+" đồng"}
function doPrint(){if(window.AndroidPrint)window.AndroidPrint.print();else window.print()}
function printInv(i){const p=S.props.find(x=>x.id===i.pid)||P(),r=S.rooms.find(x=>x.id===i.rid),s=st(i),rest=Math.max(0,i.total-i.paid),d=new Date(),dt=d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear();
 const o=document.createElement("div");o.id="pr";
 o.innerHTML='<div class="tb"><button class="pr" onclick="doPrint()">In / Lưu PDF</button><button onclick="document.getElementById(\'pr\').remove()">Đóng</button></div><div class="pg">'+
 '<div class="hd"><div><div class="nm">'+esc(p.name)+'</div><div class="sm">'+esc(p.ad||"")+(p.ph?"<br>Điện thoại: "+esc(p.ph):"")+'</div></div><div class="ti"><b>HÓA ĐƠN</b><div class="sm">Tiền thuê trọ</div></div></div>'+
 '<div class="inf"><div>Phòng<b>'+esc(rn(i.rid))+'</b></div><div>Khách thuê<b>'+esc(r&&r.tn||"")+'</b></div><div>Kỳ thanh toán<b>Tháng '+mf(i.per)+'</b></div><div>Số hóa đơn<b>HD-'+i.id.slice(0,4).toUpperCase()+'</b></div></div>'+
 '<table class="it"><tr><th>Khoản mục</th><th>Diễn giải</th><th>Thành tiền</th></tr>'+i.L.map(l=>'<tr><td>'+esc(l[0])+'</td><td>'+esc(l[1])+'</td><td>'+vnd(l[2])+'</td></tr>').join("")+'</table>'+
 '<div class="tot"><span>Tổng cộng</span><b>'+vnd(i.total)+'</b></div><div class="wd">Bằng chữ: <i>'+words(i.total)+'</i></div>'+
 '<div class="stt '+s[1]+'">'+(s[1]==="ok"?"ĐÃ THANH TOÁN":s[1]==="wn"?"Đã thu "+vnd(i.paid)+" · Còn phải thu "+vnd(rest):"CHƯA THANH TOÁN · Còn phải thu "+vnd(rest))+'</div>'+
 '<div class="ft">'+(p.bk?'<div><b>Chuyển khoản:</b> '+esc(p.bk)+'</div>':"")+'<div>'+esc(p.nt||"Cảm ơn quý khách đã thuê trọ.")+'</div><div class="sg"><div>Người lập hóa đơn</div><div>Khách thuê<br>(ký, ghi rõ họ tên)</div></div><div class="sm" style="text-align:right">Ngày in: '+dt+'</div></div></div>';
 document.body.append(o)}
render();
</script>
</body>
</html>
