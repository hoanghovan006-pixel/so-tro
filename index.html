<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HT GROUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2f1;--cd:#fff;--tx:#10201f;--mu:#5d706e;--pr:#0b7a3b;--pt:#fff;--bd:#d5dedc;--ok:#157347;--wn:#b45309;--bad:#b42318;--bs:#e4f3ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1716;--cd:#18231f;--tx:#e6efed;--mu:#97aaa7;--pr:#4cd47e;--pt:#04210f;--bd:#2a3a37;--ok:#5fd190;--wn:#f0b25a;--bad:#ff8a80;--bs:#1e2d2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1716;--cd:#18231f;--tx:#e6efed;--mu:#97aaa7;--pr:#4cd47e;--pt:#04210f;--bd:#2a3a37;--ok:#5fd190;--wn:#f0b25a;--bad:#ff8a80;--bs:#1e2d2a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:96px}
#app{max-width:640px;margin:0 auto;padding:0 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;padding:10px 0;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header select{flex:1;min-width:0;font-weight:700}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.15rem;color:var(--pr);padding-top:10px}.brand img{width:34px;height:34px}
h2{font-size:1.2rem;margin:10px 0}h3{font-size:1rem;margin:16px 0 8px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--cd)}
label{display:block;font-size:.86rem;color:var(--mu);margin:8px 0}
label input,label select{margin-top:4px;color:var(--tx);font-size:1rem}
button{padding:11px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);cursor:pointer;min-height:44px}
button.pr{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:700}
button.dg{color:var(--bad);border-color:var(--bad)}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.card{background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:8px;padding:12px;margin:10px 0}
.card.ok{border-left-color:var(--ok)}.card.wn{border-left-color:var(--wn)}.card.bad{border-left-color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mu{color:var(--mu);font-size:.9rem}
.chip{font-size:.8rem;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.wn{color:var(--wn)}.chip.bad{color:var(--bad)}
.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}.ck input{width:auto}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right}td:first-child,th:first-child{text-align:left}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:.78rem;color:var(--mu);min-height:56px}
nav button.on{color:var(--pr);font-weight:700;box-shadow:inset 0 3px var(--pr)}
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sh h3{margin-top:0;font-size:1.1rem}.bt{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.bt button{flex:1}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:90%;display:none}
textarea{min-height:180px;font:.8rem/1.4 ui-monospace,Menlo,monospace}
#pr{position:fixed;inset:0;background:#5b6664;overflow:auto;z-index:40;padding:10px;color-scheme:light}
#pr .tb{display:flex;gap:8px;max-width:min(148mm,100%);margin:0 auto 10px}#pr .tb button{flex:1}
#pr .pg{width:148mm;min-height:205mm;margin:0 auto;background:#fff;color:#14201f;padding:10mm 9mm;font-size:10pt;line-height:1.4;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pr .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:6mm;border-bottom:2px solid #0b7a3b;padding-bottom:4mm}
#pr .bd2{display:flex;gap:3mm;align-items:center}#pr .bd2 img{width:17mm;height:17mm}
#pr .nm{font-size:15pt;font-weight:700;color:#0b7a3b;line-height:1.2}
#pr .ti{text-align:right;font-size:17pt;color:#0b7a3b;white-space:nowrap}
#pr .sm{font-size:8.5pt;color:#566}
#pr .inf{display:grid;grid-template-columns:1fr 1fr;gap:2mm 6mm;margin:4mm 0;font-size:8.5pt;color:#566}
#pr .inf b{display:block;font-size:10.5pt;color:#14201f}
#pr table.it{width:100%;border-collapse:collapse}
#pr .it th{background:#e4f3ea;color:#0b7a3b;font-size:8.5pt;text-align:left;padding:2mm}
#pr .it td{padding:2mm;border-bottom:1px solid #d5dedc;text-align:left;vertical-align:top}
#pr .it td:nth-child(2){font-size:8pt;color:#566}
#pr .it th:last-child,#pr .it td:last-child{text-align:right;white-space:nowrap}
#pr .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:4mm;padding:3mm;background:#0b7a3b;color:#fff;border-radius:2mm}
#pr .tot b{font-size:15pt}
#pr .wd{margin:2mm 0 0;font-size:9pt}
#pr .stt{margin:4mm 0 0;padding:2mm;border:1.5px solid;text-align:center;font-weight:700;border-radius:2mm}
#pr .stt.ok{color:#157347}#pr .stt.bad,#pr .stt.wn{color:#b42318}
#pr .ft{margin-top:auto;padding-top:5mm;font-size:8.5pt;color:#334}
#pr .sg{display:flex;justify-content:space-around;margin-top:4mm;text-align:center;font-size:9pt}#pr .sg>div{width:42%;height:24mm}
@media screen and (max-width:620px){#pr .pg{zoom:.6}}
@media print{@page{size:A5 portrait;margin:0}html,body{height:auto}body{padding:0!important}body::before{display:none!important}body>*:not(#pr){display:none!important}#pr{position:static;background:none;padding:0;overflow:visible}#pr .tb{display:none}#pr .pg{margin:0;zoom:1}}
</style>
</head>

const D=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];
function r3(n,f){const h=n/100|0,t=n%100/10|0,u=n%10,s=[];
 if(h||(f&&(t||u)))s.push(D[h],"trăm");
 if(t>1){s.push(D[t],"mươi");if(u==1)s.push("mốt");else if(u==5)s.push("lăm");else if(u)s.push(D[u])}
 else if(t==1){s.push("mười");if(u==5)s.push("lăm");else if(u)s.push(D[u])}
 else if(u){if(s.length)s.push("lẻ");s.push(D[u])}
 return s.join(" ")}
function words(n){n=Math.round(n);if(!n)return"Không đồng";const U=["","nghìn","triệu","tỷ"],g=[];while(n>0){g.push(n%1000);n=Math.floor(n/1000)}
 const o=[];for(let i=g.length-1;i>=0;i--){if(g[i])o.push(r3(g[i],i<g.length-1)+(U[i]?" "+U[i]:""))}
 const s=o.join(" ");return s[0].toUpperCase()+s.slice(1)+" đồng"}
